<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>OAuth 回调</title>
<body style="font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px">
<h1>Tesla 授权回调</h1>
<p id="status"></p>
<table style="border-collapse:collapse"><tr><td><b>code</b></td><td><code id="code">-</code></td></tr><tr><td><b>state</b></td><td><code id="state">-</code></td></tr><tr><td><b>error</b></td><td><code id="error">-</code></td></tr></table>
<p>完整回调 URL（请复制后私下发给助手，不要公开分享）：</p>
<textarea id="url" readonly rows="4" style="width:100%"></textarea>
<p><button id="copy">复制完整 URL</button> <span id="msg"></span></p>
<script>
const p=new URLSearchParams(location.search);
for(const k of ['code','state','error'])document.getElementById(k).textContent=p.get(k)||'-';
document.getElementById('status').textContent=p.get('code')?'✅ 已收到授权 code。':(p.get('error')?'❌ 授权失败：'+(p.get('error_description')||p.get('error')):'未检测到 code 参数。');
const u=document.getElementById('url');u.value=location.href;
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('msg').textContent='已复制';}catch(e){u.select();document.execCommand('copy');document.getElementById('msg').textContent='已复制';}};
</script></body></html>
